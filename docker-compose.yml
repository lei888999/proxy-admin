services:
  sing-box-admin:
    build:
      context: .
      args:
        # Override to pin a different sing-box release.
        SING_BOX_IMAGE: ${SING_BOX_IMAGE:-ghcr.io/sagernet/sing-box:v1.13.13}
    image: sing-box-admin:latest
    container_name: sing-box-admin
    restart: unless-stopped
    # Host networking so the panel-managed sing-box can bind proxy ports directly
    # on the VPS without per-port mappings. NOTE: only works on Linux hosts.
    network_mode: host
    environment:
      PORT: ${PORT:-8080}
      DB_PATH: /data/sing-box-admin.db
      SINGBOX_DIR: /data/singbox
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in .env}
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-admin}
      DEFAULT_ADMIN_PASS: ${DEFAULT_ADMIN_PASS:-mnice7082}
      # Enable when the externally visible panel URL is HTTPS (including a TLS
      # reverse proxy). Composed explicitly so .env is not merely build-time.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Comma-separated proxy CIDRs/IPs allowed to supply X-Forwarded-For.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - singbox_admin_data:/data

volumes:
  singbox_admin_data:
